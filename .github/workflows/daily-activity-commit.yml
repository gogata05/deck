name: Daily Activity Commit

on:
  workflow_dispatch: # Manual trigger from GitHub Actions tab
  schedule:
    - cron: "0 0 * * *" # Runs every day at 0:00 AM UTC

permissions:
  contents: write # Allow workflow to push changes

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for rebase

      - name: Configure Git
        run: |
          git config --local user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --local user.name "${{ secrets.GIT_USER_NAME }}"

      - name: Create empty commit and push
        run: |
          git pull --rebase origin main
          COMMIT_DATE=$(date +%Y-%m-%d)
          git commit --allow-empty -m "🗓️ Update Deck - $COMMIT_DATE"
          git push origin main

      - name: Deploy triggered
        run: echo "✅ Empty commit pushed successfully - Vercel deploy triggered!"
